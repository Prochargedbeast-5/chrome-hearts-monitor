name: Chrome Hearts monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor.yml'
      - 'monitor.py'
      - 'run_monitor.py'
  schedule:
    - cron: '2-57/5 0-3,15-23 * * *'
permissions:
  contents: write
concurrency:
  group: chrome-hearts-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check Central time window
        id: window
        run: |
          hour=$(TZ=America/Chicago date +%H)
          if (( 10#$hour >= 10 && 10#$hour < 22 )); then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
        with:
          ref: main
      - name: Configure baseline persistence
        if: steps.window.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Poll every minute until session end or 10pm Central
        if: steps.window.outputs.active == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 -u run_monitor.py
