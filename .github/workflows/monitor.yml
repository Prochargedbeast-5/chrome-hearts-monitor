name: Chrome Hearts monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 0-3,15-23 * * *'
permissions:
  contents: write
concurrency:
  group: chrome-hearts-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # UTC schedule covers both CST and CDT; gate uses actual local time.
      - name: Check Central time window
        id: window
        run: |
          hour=$(TZ=America/Chicago date +%H)
          if (( 10#$hour >= 10 && 10#$hour < 22 )); then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside 10 a.m.–10 p.m. Central; skipping."
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
      - name: Check storefront and notify Discord
        if: steps.window.outputs.active == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 monitor.py
      - name: Save successful baseline
        if: steps.window.outputs.active == 'true'
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update monitor baseline"
              git push
            fi
          fi
